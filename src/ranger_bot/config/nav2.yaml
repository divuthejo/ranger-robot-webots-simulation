# Nav2 for the ranger TurtleBot3 Burger in the Webots nature reserve.
# Based on nav2_bringup/params/nav2_params.yaml (Jazzy 1.3.x); changes are marked "ranger".
#
# Frames: map -> odom (AMCL) -> base_link (EKF: wheel odom + IMU) -> base_footprint.
# The Jazzy diff_drive_controller takes TwistStamped on /cmd_vel, hence
# enable_stamped_cmd_vel on every node that publishes or relays velocity commands.
# Chain: controller_server -> cmd_vel_nav -> velocity_smoother -> cmd_vel_smoothed
#        -> collision_monitor -> cmd_vel

amcl:
  ros__parameters:
    # ranger: motion noise matched to the measured odometry (2026-10-31, vs Webots ground
    # truth): distance x0.997, heading from the IMU with no measurable drift. In open grass
    # the lidar sees almost nothing, so nothing shrinks the particle cloud; with all alphas
    # at 0.05 it grew ~4 cm per second of driving (alpha2 adds ~2.6 deg of heading noise
    # per 0.2 m step) until it split into clusters and the estimate jumped 2 m.
    alpha1: 0.005    # rotation noise from rotation
    alpha2: 0.002    # rotation noise from translation
    alpha3: 0.01     # translation noise from translation
    alpha4: 0.005    # translation noise from rotation
    alpha5: 0.005    # (omni only)
    base_frame_id: "base_link"       # ranger
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 3.5             # ranger: LDS-01
    laser_min_range: 0.12            # ranger
    laser_model_type: "likelihood_field"
    max_beams: 90                    # ranger: sparse world, use more of the 360 beams
    max_particles: 1000              # ranger
    min_particles: 200               # ranger
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.2
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    # ranger: the robot always spawns at the map origin (where mapping started).
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered   # ranger: EKF output
    bt_loop_duration: 10
    default_server_timeout: 200      # ranger: ms; 20 ms timed out acknowledging goals under sim load
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    enable_stamped_cmd_vel: true     # ranger
    odom_topic: /odometry/filtered   # ranger
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3  # ranger: slow robot
      movement_time_allowance: 15.0  # ranger
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.3
    # ranger: Regulated Pure Pursuit - simple, predictable and cheap on the CPU (Webots
    # and later YOLO share it). Burger: 0.22 m/s, wheel limit 6.67 rad/s.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.2
      lookahead_dist: 0.5
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 1.2
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.08
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.6
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.2
      max_robot_pose_search_dist: 10.0
      interpolate_curvature_after_goal: false

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 5                       # ranger: covers the 3.5 m lidar range in front
      height: 5
      resolution: 0.05
      robot_radius: 0.12             # ranger: Burger (~0.105 m) plus a little
      plugins: ["obstacle_layer", "rock_layer", "inflation_layer"]
      use_maximum: true              # ranger: rock_layer must only add cost
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.45       # ranger: forest gaps are ~2 m wide
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan animals
        # ranger: tracked animals' whole bodies (animal_tracker.py) - the lidar sees only a
        # horse's legs and Nav2 drove between them. Map-frame cloud: the range limit is
        # measured from the map origin, hence 50; the scan clears marks once they move on.
        animals:
          topic: /ranger/animal_cloud
          data_type: "PointCloud2"
          marking: True
          clearing: False
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_max_range: 50.0
          obstacle_min_range: 0.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
        scan:
          topic: /scan
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: true         # ranger: open grass reads inf - clear along those beams
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
      # ranger: rocks too low for the lidar (maps/keepout.*, see ranger_bot/keepout_mask.py).
      # A second static layer *before* inflation, so the zones are inflated like any obstacle
      # and planner and controller agree. (A KeepoutFilter runs after inflation: the planner
      # then routed through gaps the controller's footprint check refused.) The mask is
      # "unknown" except at the rocks, and use_maximum merges it without overwriting the map.
      rock_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /rock_mask
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.12             # ranger
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "rock_layer", "obstacle_layer", "inflation_layer"]
      use_maximum: true              # ranger: rock_layer must only add cost
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan animals
        # ranger: tracked animals' whole bodies (animal_tracker.py) - the lidar sees only a
        # horse's legs and Nav2 drove between them. Map-frame cloud: the range limit is
        # measured from the map origin, hence 50; the scan clears marks once they move on.
        animals:
          topic: /ranger/animal_cloud
          data_type: "PointCloud2"
          marking: True
          clearing: False
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_max_range: 50.0
          obstacle_min_range: 0.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
        scan:
          topic: /scan
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: true         # ranger
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.45
      # ranger: rocks too low for the lidar (maps/keepout.*, see ranger_bot/keepout_mask.py).
      # A second static layer *before* inflation, so the zones are inflated like any obstacle
      # and planner and controller agree. (A KeepoutFilter runs after inflation: the planner
      # then routed through gaps the controller's footprint check refused.) The mask is
      # "unknown" except at the rocks, and use_maximum merges it without overwriting the map.
      rock_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /rock_mask
        map_subscribe_transient_local: True
      always_send_full_costmap: True

map_saver:
  ros__parameters:
    save_map_timeout: 20.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      # ranger: unmapped space includes the lake interior - never plan through it.
      allow_unknown: false

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: true     # ranger
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

route_server:
  ros__parameters:
    boundary_radius_to_achieve_node: 1.0
    radius_to_achieve_node: 2.0
    smooth_corners: true
    operations: ["AdjustSpeedLimit", "ReroutingService", "CollisionMonitor"]
    ReroutingService:
      plugin: "nav2_route::ReroutingService"
    AdjustSpeedLimit:
      plugin: "nav2_route::AdjustSpeedLimit"
    CollisionMonitor:
      plugin: "nav2_route::CollisionMonitor"
      max_collision_dist: 3.0
    edge_cost_functions: ["DistanceScorer", "CostmapScorer"]
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
    CostmapScorer:
      plugin: "nav2_route::CostmapScorer"

velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: true     # ranger
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: False
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.22, 0.0, 1.5]   # ranger: Burger limits
    min_velocity: [-0.22, 0.0, -1.5]
    max_accel: [1.0, 0.0, 3.2]
    max_decel: [-1.0, 0.0, -3.2]
    odom_topic: "odometry/filtered"  # ranger
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    enable_stamped_cmd_vel: true     # ranger
    base_frame_id: "base_link"       # ranger
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel_auto"   # ranger: into mode_manager, which owns /cmd_vel
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.15
      max_height: 2.0
      enabled: True

docking_server:
  ros__parameters:
    enable_stamped_cmd_vel: true     # ranger (unused, but launched by nav2_bringup)
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3
