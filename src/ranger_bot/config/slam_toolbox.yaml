# slam_toolbox (online async) for the ranger TurtleBot3 Burger.
# Based on slam_toolbox/config/mapper_params_online_async.yaml; changed values are marked.
slam_toolbox:
  ros__parameters:

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_link              # ranger: our TF tree is odom -> base_link
    scan_topic: /scan_ccw              # ranger: Webots scans are clockwise, see scan_ccw.py
    use_map_saver: true
    mode: mapping #localization

    # if you'd like to immediately start continuing a map at a given pose
    # or at the dock, but they are mutually exclusive, if pose is given
    # will use pose
    #map_file_name: test_steve
    # map_start_pose: [0.0, 0.0, 0.0]
    #map_start_at_dock: true

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02 #if 0 never publishes odometry
    map_update_interval: 2.0         # ranger: faster map refresh while driving
    resolution: 0.05
    restamp_tf: false
    min_laser_range: 0.0 #for rastering images
    max_laser_range: 3.5             # ranger: LDS-01 range
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000 #// program needs a larger stack size to serialize large maps
    enable_interactive_mode: true

    # General Parameters
    use_scan_matching: false   # ranger: in this sparse, foliage-heavy world scan matching made the pose
                               # worse (0.46 m error vs 0.03 m for IMU-fused odometry), so the map
                               # is built from odometry poses
    use_scan_barycenter: true
    minimum_travel_distance: 0.2     # ranger: short-range lidar, add scans more often
    minimum_travel_heading: 0.3      # ranger
    check_min_dist_and_heading_precisely: false
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 4.0   # ranger
    link_match_minimum_response_fine: 0.3     # ranger: reject weak scan links
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 2.0     # ranger: odometry is IMU-fused, loops are never far off
    do_loop_closing: false     # ranger: false loop closures broke two maps; IMU-fused odometry barely drifts
    loop_match_minimum_chain_size: 10           
    loop_match_maximum_variance_coarse: 3.0  
    loop_match_minimum_response_coarse: 0.5   # ranger: sparse/foliage scans give false loop closures
    loop_match_minimum_response_fine: 0.6     # ranger

    # Correlation Parameters - Correlation Parameters
    correlation_search_space_dimension: 0.2   # ranger: let scan matching refine by +-10 cm only
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1 

    # Correlation Parameters - Loop Closure Parameters
    loop_search_space_dimension: 4.0     # ranger
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    distance_variance_penalty: 1.0     # ranger: trust the (IMU-fused) odometry more
    angle_variance_penalty: 3.0        # ranger: heading comes from the IMU, keep it

    fine_search_angle_offset: 0.00349     
    coarse_search_angle_offset: 0.0524    # ranger: +-3 deg (was +-20); heading comes from the IMU
    coarse_angle_resolution: 0.0349        
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
